project_id = "ayam-norliza-ops"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
# Local-only fixtures (e.g. e2e login accounts) that must never ship in a
# migration -- see supabase/seed.sql. Runs after migrations on `db reset`.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:9999"
additional_redirect_urls = ["http://localhost:9999/auth/callback"]
jwt_expiry = 3600
# Master switch: must stay true or it overrides [auth.email].enable_signup
# below and blocks buyer self-registration ("Signups not allowed for this
# instance"). Dashboard/seller access stays invite-gated by org membership.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }} ."

[auth.mfa]
max_enrolled_factors = 5

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[edge_runtime]
enabled = true

[functions.invitation-accept]
verify_jwt = true

# The three scheduled functions below stay verify_jwt = false: pg_cron calls
# them server-to-server, not on behalf of a signed-in user. They are not
# unauthenticated, though -- each requires an `x-cron-secret` header matching
# its CRON_SECRET env var (supabase/functions/_shared/cron-guard.ts, wired up
# by 20260901000008_cron_shared_secret.sql). Turning verify_jwt on would not
# help: the anon key alone satisfies it, so it gates nothing a URL-guesser
# could not supply.

[functions.access-review-reminder]
verify_jwt = false

[functions.temporary-access-expiry]
verify_jwt = false

[functions.market-price-sync]
verify_jwt = false
